# Builds and tests the CI presets on Linux, macOS and Windows, and checks formatting.
# Linux runs in an Arch Linux container so CI has the same current GCC/Clang and Qt as the dev machine.
# macOS and Windows install the oldest supported Qt (6.8) instead, so use of newer Qt API is caught there.
name: CI

on:
  push:
  pull_request:
  workflow_call:   # the Release workflow runs all of CI before it tags

jobs:
  linux:
    name: linux / ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-gcc, ci-clang, asan, tidy]
    steps:
      - name: Install toolchain and Qt
        # A font is needed for the offscreen platform the widget tests use: without one, text measures zero.
        run: pacman -Syu --noconfirm --needed cmake ninja clang git qt6-base ttf-dejavu
      - uses: actions/checkout@v7
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}

  # Apple Clang from the runner's default Xcode.
  # No asan here: the Linux asan job sanitizes the same code, and Linux also has leak detection, which Apple's
  # AddressSanitizer runtime lacks. The asan preset itself still works on a Mac for local use.
  macos:
    name: macos / ${{ matrix.preset }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-clang]
    steps:
      - name: Install Ninja
        run: brew install ninja
      # The Qt installer's universal (arm64 + x86_64) build; Homebrew's Qt is arm64-only and always the newest.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - uses: actions/checkout@v7
      - name: Configure, build and test
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: cmake --workflow --preset ${{ matrix.preset }}

  # MSVC from the runner's Visual Studio; msvc-dev-cmd sets up the Developer PowerShell environment.
  # install-qt-action also puts Qt's bin directory on PATH, so the tests find the Qt DLLs.
  windows:
    name: windows / ci-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true
      - name: Configure, build and test
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: cmake --workflow --preset ci-msvc

  format:
    name: clang-format
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install clang-format
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@v7
      - name: Check formatting
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' \
            | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
